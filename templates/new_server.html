<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Server — Hybris Log Monitor</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --border: #232733;
    --text: #d7dbe3; --muted: #8890a0; --error: #ff6b6b; --accent: #5aa9ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
    font-size: 14px; line-height: 1.5;
  }
  header { padding: 24px 32px; border-bottom: 1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  a.back { color: var(--muted); text-decoration: none; font-size: 13px; }
  a.back:hover { color: var(--accent); }
  main { max-width: 560px; margin: 0 auto; padding: 32px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=password], input[type=number] {
    width: 100%; padding: 10px 12px; background: #0b0d12; border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); font-family: inherit; font-size: 13.5px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .radio-group { display: flex; gap: 16px; margin-top: 6px; }
  .radio-group label { display: flex; align-items: center; gap: 6px; text-transform: none; font-size: 13.5px; color: var(--text); margin: 0; }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  .error-box { background: rgba(255,107,107,.1); border: 1px solid var(--error); color: var(--error);
               padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; font-size: 13px; }
  .btn { display: inline-block; padding: 10px 20px; border-radius: 4px; border: 1px solid var(--accent);
         color: var(--accent); background: transparent; font-family: inherit; font-size: 13.5px;
         cursor: pointer; margin-top: 24px; width: 100%; }
  .btn:hover { background: rgba(90,169,255,.1); }
  #key-field, #password-field { display: none; }
</style>
</head>
<body>

<header>
  <h1>Add Server</h1>
  <a class="back" href="/servers">&larr; All servers</a>
</header>

<main>
  <div class="card">
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="POST" action="/new">
      <label>Server name</label>
      <input type="text" name="name" placeholder="e.g. prod-node-1" value="{{ form.name if form else '' }}" required>

      <div class="row">
        <div>
          <label>Host</label>
          <input type="text" name="host" placeholder="10.0.1.23 or hostname" value="{{ form.host if form else '' }}" required>
        </div>
        <div style="flex:0 0 100px;">
          <label>Port</label>
          <input type="number" name="port" value="{{ form.port if form else '22' }}">
        </div>
      </div>

      <label>Username</label>
      <input type="text" name="username" placeholder="hybris" value="{{ form.username if form else '' }}" required>

      <label>Authentication</label>
      <div class="radio-group">
        <label><input type="radio" name="auth_method" value="password" checked onclick="toggleAuth('password')"> Password</label>
        <label><input type="radio" name="auth_method" value="key" onclick="toggleAuth('key')"> SSH key</label>
      </div>

      <div id="password-field" style="display:block;">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••">
      </div>
      <div id="key-field">
        <label>Private key path (on this machine)</label>
        <input type="text" name="key_path" placeholder="/home/you/.ssh/id_rsa">
      </div>

      <label>Log file path (the actively-written log to tail)</label>
      <input type="text" name="log_path" placeholder="/opt/hybris/log/tomcat/console.log"
             value="{{ form.log_path if form else '' }}" required>
      <div class="hint">
        This is the live file — the one currently being appended to. Rotated / older
        dated log files in the same directory can be browsed separately from the
        analytics page once this server is added.
      </div>

      <button class="btn" type="submit">Connect &amp; start monitoring</button>
    </form>
  </div>
</main>

<script>
function toggleAuth(mode) {
  document.getElementById("password-field").style.display = mode === "password" ? "block" : "none";
  document.getElementById("key-field").style.display = mode === "key" ? "block" : "none";
}
</script>

</body>
</html>
