<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ server.name }} — Live Monitor</title>
<style>
  :root {
    --aubergine: #4a154b;      /* Slack's signature purple */
    --aubergine-2: #611f69;
    --green: #2bac76;
    --red: #e01e5a;
    --yellow: #ecb22e;
    --bg: #ffffff;
    --sidebar-bg: #f6f6f6;
    --border: #e3e3e3;
    --text: #1d1c1d;
    --muted: #616061;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
                 Arial, "Noto Sans", "Apple Color Emoji", sans-serif;
    font-size: 14px; line-height: 1.45;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }

  /* ---------- Workspace: two panes ---------- */
  /* ---------- Date retarget bar ---------- */
  .retarget-bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 8px 22px; background: #faf8fb; border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .retarget-bar label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .retarget-bar input[type=date] {
    background: #fff; border: 1px solid #c5c7ca; border-radius: 6px;
    color: var(--text); font-family: inherit; font-size: 13px; padding: 6px 10px;
  }
  .retarget-bar input[type=date]:focus { outline: none; border-color: var(--aubergine-2); }
  .retarget-bar .retarget-btn {
    padding: 6px 14px; border-radius: 6px; border: 1px solid var(--aubergine);
    color: var(--aubergine); background: transparent; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .retarget-bar .retarget-btn:hover { background: rgba(97,31,105,.06); }
  .retarget-bar .retarget-btn:disabled { opacity: .5; cursor: not-allowed; }
  .retarget-msg { color: var(--muted); font-size: 12.5px; }

  .workspace { display: flex; flex: 1 1 auto; min-height: 0; }
  .sidebar {
    flex: 0 0 400px; min-width: 300px; max-width: 460px;
    background: var(--sidebar-bg); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .sidebar-header { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); }
  .sidebar-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  .filters { display: flex; gap: 8px; }
  .filters input[type=text] { flex: 1; min-width: 0; }
  input[type=text], select {
    background: #fff; border: 1px solid #c5c7ca; border-radius: 6px;
    color: var(--text); font-family: inherit; font-size: 13px; padding: 7px 10px;
  }
  input[type=text]:focus, select:focus { outline: none; border-color: var(--aubergine-2); }
  .error-list { flex: 1 1 auto; overflow-y: auto; padding: 8px; min-height: 0; }
  .empty-note { color: var(--muted); text-align: center; padding: 40px 16px; font-size: 13px; }
.error-item {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    transition: box-shadow .08s ease, border-color .08s ease;
  }
  .error-item:hover { border-color: var(--aubergine-2); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .error-item.selected { border-color: var(--aubergine); box-shadow: 0 0 0 1px var(--aubergine); }
  .error-item-top { display: flex; align-items: center; gap: 8px; }
  .exception { font-weight: 600; font-size: 13px; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count-pill {
    flex: 0 0 auto; min-width: 26px; text-align: center; padding: 1px 8px;
    border-radius: 999px; background: #eceff1; color: #41434a; font-size: 12px; font-weight: 600;
  }
  .error-item-msg { color: var(--muted); font-size: 12.5px; margin: 5px 0 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .error-item-meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
  .rel { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
  .rel .rel-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .rel.high .rel-dot { background: var(--red); }
  .rel.med .rel-dot { background: var(--yellow); }
  .rel.low .rel-dot { background: var(--green); }
  .rel.high { color: var(--red); }
  .rel.med { color: #b08a00; }
  .rel.low { color: var(--green); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; flex: 0 0 auto; }
  .badge.error { background: rgba(224,30,90,.12); color: var(--red); }
  .badge.warning { background: rgba(236,178,46,.18); color: #9a6d00; }

  /* ---------- Detail pane ---------- */
  .detail-pane { flex: 1 1 auto; overflow-y: auto; padding: 26px 30px; min-width: 0; }
  .detail-empty { color: var(--muted); text-align: center; margin-top: 18vh; font-size: 15px; }
  .detail-empty .slack-mark { font-size: 40px; display: block; margin-bottom: 10px; }

  .detail-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .detail-header .exception { font-size: 17px; }
  .detail-message { font-size: 14.5px; margin: 4px 0 14px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .detail-meta { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
  .detail-meta b { color: var(--text); font-weight: 600; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

  .detail-frame { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; background: #f3f0f5; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 14px; color: #3a3a3a; word-break: break-all; }
  .stacktrace {
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; line-height: 1.5;
    background: #fafafa; border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; margin: 0 0 14px; white-space: pre-wrap; word-break: break-word; color: #2a2a2a;
  }
  .stack-toggle { display: inline-block; color: var(--aubergine-2); background: none; border: none; font-size: 12px; font-weight: 600; cursor: pointer; padding: 0 0 10px; }
  .stack-toggle:hover { text-decoration: underline; }

  .context-box { margin-bottom: 16px; }
  .context-box label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 5px; }
  .context-box input[type=text] { width: 100%; }
.analyze-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--aubergine); color: #fff; border: none; border-radius: 6px;
    padding: 9px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .analyze-btn:hover { background: var(--aubergine-2); }
  .analyze-btn:disabled { background: #b6aeb9; cursor: not-allowed; }

  .analysis { margin-top: 16px; }
  .analysis .spinner { color: var(--muted); font-size: 13px; }
  .analysis-card {
    background: #fbf8f4; border: 1px solid #ecdfc9; border-left: 4px solid var(--yellow);
    border-radius: 8px; padding: 16px 18px; white-space: pre-wrap; word-break: break-word;
  }
  .analysis-card h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #8a6d00; }
  .analysis-card .block { margin-bottom: 12px; }
  .analysis-card .block:last-child { margin-bottom: 0; }
  .analysis-card .block-label { font-weight: 700; font-size: 12.5px; color: var(--aubergine); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .03em; }
  .analysis-card .block-label:first-child { margin-top: 0; }
  .analysis-card .block p { margin: 0; font-size: 13.5px; color: var(--text); }

  @media (max-width: 860px) {
    .workspace { flex-direction: column; }
    .sidebar { flex: 0 0 40%; max-width: none; border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

{% include "_nav.html" %}

<div class="retarget-bar">
  <label for="live-date">Live log date</label>
  <input type="date" id="live-date">
  <button class="retarget-btn" id="jump-date" type="button">Jump to date</button>
  <span class="retarget-msg" id="retarget-msg"></span>
</div>

<div class="workspace">
  <!-- LEFT: error list -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <p class="sidebar-title">Errors &amp; warnings</p>
      <div class="filters">
        <input type="text" id="search-input" placeholder="Search…">
        <select id="severity-filter">
          <option value="all">All</option>
          <option value="error">Errors</option>
          <option value="warning">Warnings</option>
        </select>
      </div>
    </div>
    <div class="error-list" id="error-list">
      <div class="empty-note">Loading errors…</div>
    </div>
  </aside>

  <!-- RIGHT: details + AI -->
  <section class="detail-pane" id="detail-pane">
    <div class="detail-empty" id="detail-empty">
      <span class="slack-mark">⬢</span>
      Select an error on the left to see its details and get an AI analysis.
    </div>
    <div id="detail-content" style="display:none;"></div>
  </section>
</div>

<script>

const SERVER_ID = "{{ server.id }}";
const REFRESH_MS = 6000;

let rowsById = new Map();   // gid -> row
let selectedGid = null;
let renderedGid = null;     // gid currently shown in the detail pane

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s == null ? "" : s;
  return div.innerHTML;
}
function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function relClass(row) {
  return ((row.relevance || {}).label || "Low").toLowerCase();
}

function renderList(rows) {
  const list = document.getElementById("error-list");
  if (rows.length === 0) {
    list.innerHTML = '<div class="empty-note">No errors or warnings match the current filter.</div>';
    return;
  }
  list.innerHTML = "";
  for (const row of rows) {
    rowsById.set(row.gid, row);
    const el = document.createElement("div");
    el.className = "error-item" + (row.gid === selectedGid ? " selected" : "");
    el.dataset.gid = row.gid;
    el.onclick = () => selectError(row.gid);
    const rel = row.relevance || {};
    el.innerHTML = `
      <div class="error-item-top">
        <span class="badge ${row.severity}">${row.severity}</span>
        <span class="exception">${escapeHtml(row.exception_class || "—")}</span>
        <span class="count-pill">${row.count || 0}</span>
      </div>
      <div class="error-item-msg">${escapeHtml((row.message || "").slice(0, 160))}</div>
      <div class="error-item-meta">
        <span class="rel ${relClass(row)}"><span class="rel-dot"></span>${escapeHtml(rel.label || "Low")}</span>
        <span>· ${row.count || 0}×</span>
        <span>· last ${fmtTime(row.last_seen)}</span>
      </div>`;
    list.appendChild(el);
  }
}

function renderDetail(row) {
  renderedGid = row.gid;
  document.getElementById("detail-empty").style.display = "none";
  const content = document.getElementById("detail-content");
  content.style.display = "block";

  const raw = row.sample_raw_text || "";
  content.innerHTML = `
    <div class="detail-header">
      <span class="badge ${row.severity}">${row.severity}</span>
      <span class="exception">${escapeHtml(row.exception_class || "—")}</span>
    </div>
    <div class="detail-message">${escapeHtml(row.message || "")}</div>
    <div class="detail-meta">
      <span>Frequency <b id="det-count">${row.count || 0}×</b></span>
      <span>Relevance <b id="det-rel">${escapeHtml((row.relevance || {}).label || "Low")}</b></span>
      <span>First seen <b id="det-first">${fmtTime(row.first_seen)}</b></span>
      <span>Last seen <b id="det-last">${fmtTime(row.last_seen)}</b></span>
    </div>
    <hr class="divider">
    ${row.top_frame ? `<div class="detail-frame">at ${escapeHtml(row.top_frame)}</div>` : ""}
    ${raw ? `<button class="stack-toggle" id="stack-toggle" type="button">▸ Show log snippet</button>
             <pre class="stacktrace" id="stacktrace" style="display:none;">${escapeHtml(raw)}</pre>` : ""}
    <div class="context-box">
      <label for="issue-description">Extra context for the AI (optional)</label>
      <input type="text" id="issue-description" placeholder="e.g. checkout failures reported since 14:00">
    </div>
    <button class="analyze-btn" id="analyze-btn" type="button">✨ Analyze with AI</button>
    <div class="analysis" id="analysis-box"></div>`;

  if (raw) {
    document.getElementById("stack-toggle").onclick = () => {
      const st = document.getElementById("stacktrace");
      const tog = document.getElementById("stack-toggle");
      const open = st.style.display !== "none";
      st.style.display = open ? "none" : "block";
      tog.textContent = open ? "▸ Show log snippet" : "▾ Hide log snippet";
    };
  }
  document.getElementById("analyze-btn").onclick = analyze;
}

/** In-place update of the selected row's live meta numbers, so a refresh
 *  never rebuilds the pane and wipes the AI analysis. */
function updateDetailMeta(row) {
  const count = document.getElementById("det-count");
  const rel = document.getElementById("det-rel");
  const last = document.getElementById("det-last");
  if (count) count.textContent = `${row.count || 0}×`;
  if (rel) rel.textContent = (row.relevance || {}).label || "Low";
  if (last) last.textContent = fmtTime(row.last_seen);
}

function selectError(gid) {
  selectedGid = gid;
  const row = rowsById.get(gid);
  if (!row) return;
  document.querySelectorAll(".error-item").forEach(el => {
    el.classList.toggle("selected", el.dataset.gid === gid);
  });
  renderDetail(row);
}

async function analyze() {
  if (!selectedGid) return;
  const box = document.getElementById("analysis-box");
  const btn = document.getElementById("analyze-btn");
  const issue = encodeURIComponent((document.getElementById("issue-description") || {}).value || "");
  btn.disabled = true;
  box.innerHTML = '<div class="spinner">Asking the AI…</div>';
  try {
    const resp = await fetch(`/api/servers/${SERVER_ID}/suggest/${selectedGid}?issue_description=${issue}`);
    const data = await resp.json();
    if (!resp.ok) {
      box.innerHTML = `<div class="analysis-card"><h3>Analysis failed</h3><p>${escapeHtml(data.error || "request failed")}</p></div>`;
      btn.disabled = false;
      return;
    }
    let html = '<div class="analysis-card">';
    if (data.root_cause) html += `<div class="block-label">Root cause</div><div class="block"><p>${escapeHtml(data.root_cause)}</p></div>`;
    if (data.fix) html += `<div class="block-label">Suggested fix</div><div class="block"><p>${escapeHtml(data.fix)}</p></div>`;
    if (!data.root_cause && !data.fix && data.suggestion) html += `<div class="block"><p>${escapeHtml(data.suggestion)}</p></div>`;
    html += "</div>";
    box.innerHTML = html || '<div class="analysis-card"><h3>Analysis</h3><p><em>No suggestion returned.</em></p></div>';
  } catch (err) {
    box.innerHTML = `<div class="analysis-card"><h3>Analysis failed</h3><p>${escapeHtml(String(err))}</p></div>`;
    btn.disabled = false;
  }
}

function ymdToDateInput(ymd) {
  return `${ymd.slice(0, 4)}-${ymd.slice(4, 6)}-${ymd.slice(6, 8)}`;
}
function extractDateFromPath(path) {
  const m = String(path || "").match(/(\d{8})\.log/);
  return m ? ymdToDateInput(m[1]) : "";
}
function initDateBar() {
  const cur = document.getElementById("current-file");
  const v = extractDateFromPath(cur ? cur.textContent : "");
  if (v) document.getElementById("live-date").value = v;
}
async function jumpToDate() {
  const inp = document.getElementById("live-date");
  const msg = document.getElementById("retarget-msg");
  const btn = document.getElementById("jump-date");
  const ymd = (inp.value || "").replace(/-/g, "");
  if (!/^\d{8}$/.test(ymd)) { msg.textContent = "Pick a valid date first."; return; }
  btn.disabled = true;
  msg.textContent = "Switching live file…";
  try {
    const resp = await fetch(`/api/servers/${SERVER_ID}/date?date=${ymd}`, { method: "POST" });
    const data = await resp.json();
    if (!resp.ok) { msg.textContent = data.error || "Failed to switch date."; btn.disabled = false; return; }
    msg.textContent = `Now tailing ${data.path}`;
    selectedGid = null; renderedGid = null; rowsById = new Map();
    await refreshLiveErrors();
    await refreshStatus();
  } catch (e) {
    msg.textContent = "Request failed.";
  }
  btn.disabled = false;
}

async function refreshStatus() {
  try {
    const resp = await fetch(`/api/servers/${SERVER_ID}/status`);
    const data = await resp.json();
    const dot = document.getElementById("status-dot");
    const label = document.getElementById("status-label");
    dot.className = "dot " + (data.status || "not started").replace(" ", "-");
    label.textContent = data.status || "not started";
    if (data.current_path) document.getElementById("current-file").textContent = data.current_path;
    document.getElementById("last-polled").textContent = data.last_polled_at ? fmtTime(data.last_polled_at) : "—";
    document.getElementById("total-seen").textContent = data.total_entries_seen || 0;
  } catch (e) { /* transient */ }
}

async function refreshLiveErrors() {
  const q = encodeURIComponent(document.getElementById("search-input").value);
  const severity = document.getElementById("severity-filter").value;
  try {
    const resp = await fetch(`/api/servers/${SERVER_ID}/errors?q=${q}&severity=${severity}&sort=count`);
    const data = await resp.json();
    renderList(data.rows || []);
    // Keep the selected error's detail pane in sync if it still exists.
    if (selectedGid) {
      const still = rowsById.get(selectedGid);
      if (still) {
        if (renderedGid === selectedGid) {
          updateDetailMeta(still);  // refresh numbers without wiping the AI analysis
        } else {
          renderDetail(still);
        }
      } else {
        selectedGid = null;
        renderedGid = null;
        document.getElementById("detail-content").style.display = "none";
        document.getElementById("detail-empty").style.display = "block";
      }
    }
  } catch (e) { /* transient */ }
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

document.getElementById("search-input").addEventListener("input", debounce(refreshLiveErrors, 300));
document.getElementById("severity-filter").addEventListener("change", refreshLiveErrors);
document.getElementById("jump-date").addEventListener("click", jumpToDate);

initDateBar();
refreshStatus();
refreshLiveErrors();
setInterval(refreshStatus, REFRESH_MS);
setInterval(refreshLiveErrors, REFRESH_MS);
</script>

</body>
</html>
